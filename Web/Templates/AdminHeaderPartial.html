{# 后台子页面共用的顶栏。
   和主控制台的区别：不显示那排操作标签，改为当前子栏目自己的导航。
   需要的上下文：ActiveAdminPage、AdminUser、DefaultTheme #}
<header class="AdminHeader">
    <a class="AdminBrand" href="/Admin/">
        <span class="AdminBrandName">鼠鼠娱乐中心</span>
        <span class="AdminBrandTag">后台管理</span>
    </a>

    <nav class="AdminSubNav">
        <a class="TabLink{{ ' IsActive' if ActiveAdminPage == 'Analytics' }}"
           href="{{ url_for('AnalyticsApi.AnalyticsPage') }}">访问统计</a>
        <a class="TabLink{{ ' IsActive' if ActiveAdminPage == 'AnalyticsRecords' }}"
           href="{{ url_for('AnalyticsApi.RecordsPage') }}">访问明细</a>
    </nav>

    <div class="AdminHeaderActions">
        <span class="AdminUser">{{ AdminUser }}</span>
        <button id="ThemeToggle" class="IconButton" type="button"
                title="切换深浅色" aria-label="切换深浅色">
            <svg class="IconSun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2"></circle>
                <path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"></path>
            </svg>
            <svg class="IconMoon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.6 8.6 0 1 0 10.2 10.2Z"></path>
            </svg>
        </button>
        <a class="GhostButton" href="/Admin/">返回控制台</a>
    </div>
</header>
