<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ DefaultTheme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>设置新密码 · 鼠鼠娱乐中心</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/AdminStyle.css') }}">
    <script src="{{ url_for('static', filename='JS/ThemeBoot.js') }}"></script>
</head>
<body>
<div class="BackdropBase BackdropGradient"></div>
<div class="LoginShell">
    <div class="LoginCard">
        <h1 class="LoginTitle">设置新密码</h1>
        <p class="LoginSubtitle">首次登录，请修改初始密码后继续</p>
        <form id="InitialPasswordForm" class="LoginStep">
            <label class="FieldLabel" for="InitialOldPassword">当前密码</label>
            <input id="InitialOldPassword" class="FieldInput" type="password"
                   autocomplete="current-password" required>
            <label class="FieldLabel" for="InitialNewPassword">新密码</label>
            <input id="InitialNewPassword" class="FieldInput" type="password"
                   autocomplete="new-password" minlength="6" placeholder="至少 6 个字符" required>
            <label class="FieldLabel" for="InitialConfirmPassword">确认新密码</label>
            <input id="InitialConfirmPassword" class="FieldInput" type="password"
                   autocomplete="new-password" minlength="6" required>
            <p id="InitialPasswordMessage" class="FormMessage" role="status" hidden></p>
            <button id="InitialPasswordButton" class="PrimaryButton PrimaryButtonBlock" type="submit">保存并进入后台</button>
        </form>
        <div class="LoginFooter">
            <button id="InitialLogoutButton" class="MiniButton" type="button">退出登录</button>
            <button id="ThemeToggle" class="MiniButton" type="button">切换主题</button>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='JS/AdminScript.js') }}"></script>
</body>
</html>
